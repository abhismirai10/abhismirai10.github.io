- title: Experience
  type: time_table
  contents:
    - title: Research Assistant
      institution: NEural TransmissionS (NETS) Lab, Florida
      year: Jan'24 - Dec'24
      description:
        - Developed and evaluated imitation learning and reinforcement learning for custom 6 DOF robotic manipulators using tools like PyTorch, Isaac Sim, Isaac Lab and the LeRobot framework.
        - Developed a model-based pick-and-place system in Drake to compare classical and learning-based robotics.
        - Trained and deployed Action Chunking with Transformers (ACT), Action Diffusion Policies and Proximal Policy Optimization (PPO), achieving up to 85% success in dynamic manipulation tasks such as stacking, orienting, and sliding.
        - Performed comparative analysis of reinforcement learning (e.g., PPO) vs. classical methods, identifying strengths and limitations for industrial-scale deployment.

    - title: Robotics Project Developer Intern
      institution: Kennedy Space Center Visitor Complex, Florida, USA
      year: June'24 – Jan'24
      description:
        - Designed and built an educational replica of the NASA Perseverance Rover for students and visitors, using Fusion 360, Raspberry Pi, and STM32 to demonstrate real-world space robotics concepts.
        - Developed a ROS2-based control with C++ featuring real-time motion control for navigation and trajectory tracking.
        - Integrated and calibrated IMUs, ultrasonic sensors, and cameras for semi-autonomous operation, enabling obstacle detection, localization, and basic path planning.
        - Collaborated with educators to design an interactive demonstration of space technologies to the students.

    - title: Mechanical Engineer Intern
      institution: Jaycon Systems, Florida, USA
      year: Sep'24 – Dec'24
      description:
        - Designed and simulated mechanical components of an augmented reality (AR) device using Fusion 360 and ANSYS, ensuring reliability and performance under real-world use conditions.
        - Built and deployed deep learning-based object detection and tracking systems using YOLO and OpenCV, fully integrated into AR hardware and optimized for real-time performance on NVIDIA Jetson Orin.
        - Enhanced on-device AI inference to support interactive object recognition within AR environments, improving user responsiveness and system autonomy. 

    - title: Robotics Engineer
      institution: BandG Robotics, India
      year: Jan'21 – Dec'22
      description:
        - Programmed robotic manipulators using ROS and Python, enhancing motion accuracy with advanced control algorithms.
        - Designed custom robotic end-effectors and mechanical components in Fusion 360 and SolidWorks, increasing system adaptability across diverse use cases.
        - Refined CNC manufacturing workflows by using Mastercam to optimize toolpaths and machining parameters, resulting in high-precision and efficient production of robotic parts.

